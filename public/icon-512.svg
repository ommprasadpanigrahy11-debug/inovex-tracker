<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E5F3A"/>
      <stop offset="100%" stop-color="#242721"/>
    </linearGradient>
    <linearGradient id="glyphGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF1E3"/>
      <stop offset="100%" stop-color="#8FA87B"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad512)"/>
  
  <!-- Outer subtle radar ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(237, 241, 227, 0.12)" stroke-width="4" stroke-dasharray="12 12"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(237, 241, 227, 0.2)" stroke-width="4"/>

  <!-- Center Hexagon / Shield -->
  <polygon points="256,118 360,178 360,302 256,362 152,302 152,178" fill="rgba(237, 241, 227, 0.08)" stroke="#8FA87B" stroke-width="8"/>

  <!-- High-Tech Lightning Bolt -->
  <path d="M262 150 L194 268 L250 268 L240 364 L324 236 L268 236 Z" fill="url(#glyphGrad512)" filter="url(#glow512)"/>

  <!-- Accent Status Dot -->
  <circle cx="360" cy="178" r="12" fill="#3E8A5E"/>
</svg>
