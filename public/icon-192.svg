<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E5F3A"/>
      <stop offset="100%" stop-color="#242721"/>
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF1E3"/>
      <stop offset="100%" stop-color="#8FA87B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle radar ring -->
  <circle cx="96" cy="96" r="74" fill="none" stroke="rgba(237, 241, 227, 0.12)" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="96" cy="96" r="54" fill="none" stroke="rgba(237, 241, 227, 0.22)" stroke-width="2"/>

  <!-- Center Hexagon / Shield -->
  <polygon points="96,44 136,66 136,112 96,134 56,112 56,66" fill="rgba(237, 241, 227, 0.08)" stroke="#8FA87B" stroke-width="3"/>

  <!-- High-Tech Lightning Bolt -->
  <path d="M98 56 L72 100 L94 100 L90 136 L122 88 L100 88 Z" fill="url(#glyphGrad)" filter="url(#glow)"/>

  <!-- Accent Status Dot -->
  <circle cx="136" cy="66" r="5" fill="#3E8A5E"/>
</svg>
